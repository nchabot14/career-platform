# Installed as /etc/nginx/sites-available/career-platform. Certbot adds the
# HTTPS (443) parts to the nickchabot.com block when the certificate is issued.
upstream career_platform {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
}

# Requests by bare IP or any other hostname get a 404, not the site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    listen [::]:80;
    server_name nickchabot.com;

    # Resume and application uploads may be up to 10 MiB (next.config.ts).
    client_max_body_size 11m;

    location / {
        proxy_pass http://career_platform;
        proxy_next_upstream error timeout http_502;
        proxy_set_header Host $host;
        # Overwrite, never append: clientIp() in lib/security/rate-limit.ts
        # trusts these headers for the contact-form limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
