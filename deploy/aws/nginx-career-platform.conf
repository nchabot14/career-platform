# Installed as /etc/nginx/sites-available/career-platform. Certbot adds the
# HTTPS (443) parts and the HTTP-to-HTTPS redirect to the site block when the
# certificate is issued. aws.nickchabot.com points straight at the Elastic IP,
# so the server can be checked over HTTPS before nickchabot.com moves here.
upstream career_platform {
    server 127.0.0.1:8000 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:8001 max_fails=1 fail_timeout=10s;
}

# Requests by bare IP or any other hostname get a 404, not the site.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

# HTTPS for a bare IP or any other hostname: refuse the TLS handshake, so the
# site's certificate and pages are never served under another name.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name nickchabot.com aws.nickchabot.com;

    # Resume and application uploads may be up to 10 MiB (next.config.ts).
    client_max_body_size 11m;

    location / {
        proxy_pass http://career_platform;
        proxy_next_upstream error timeout http_502;
        proxy_set_header Host $host;
        # Overwrite, never append: clientIp() in lib/security/rate-limit.ts
        # trusts these headers for the contact-form limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
